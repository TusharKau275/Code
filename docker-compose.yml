version: "3.8"

services:
  phishguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
